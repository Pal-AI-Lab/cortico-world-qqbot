<!doctype html>
<html lang="zh-CN" data-color-mode="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: auto; }
  body { margin: 0; background: #F4F5F4; }
  .frame { width: 1152px; margin: 0 auto; padding: 40px 0 48px; }
  .head { display: flex; align-items: center; gap: 18px; padding-bottom: 28px; border-bottom: 1px solid #E2E4E2; }
  .head img { width: 56px; height: 56px; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 600; color: #1B1626; }
  .head .sub { margin-top: 6px; font-size: 13px; color: #6B6F6C; }
  .head .meta { margin-left: auto; text-align: right; font-size: 13px; color: #6B6F6C; line-height: 1.7; }
  .head .meta b { color: #1B1626; font-weight: 600; }
  .tabs { display: flex; gap: 34px; border-bottom: 1px solid #E2E4E2; margin-bottom: 28px; }
  .tabs span { padding: 18px 4px 14px; font-size: 14px; color: #6B6F6C; border-bottom: 2px solid transparent; }
  .tabs span.on { color: #1B1626; font-weight: 600; border-color: #00A870; }
  .foot { display: flex; margin-top: 56px; padding-top: 18px; border-top: 1px solid #E2E4E2; font-size: 12px; color: #6B6F6C; }
  .foot span:last-child { margin-left: auto; color: #3A3D3B; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <img src="icon.svg" alt="">
    <div><h1>QQ 机器人</h1><div class="sub">cortico-world-qqbot · Cortico World API 6 · v0.3.2</div></div>
    <div class="meta"><b>Coo 连接着的 QQ 机器人入口</b><br>界面预览 · 示例数据</div>
  </div>
  <div class="tabs"><span data-tab="connection">连接</span><span data-tab="configuration">配置</span></div>
  <div id="panel"></div>
  <div class="foot"><span>示例二维码与凭证仅用于界面展示，不能绑定机器人。</span><span>Pal AI Lab · QQ 机器人</span></div>
</div>
<script type="module" src="entry.js"></script>
</body>
</html>
